apiVersion: v1
kind: Pod
metadata:
  name: cuda-vmm-interpose-microtest
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: ACR_VLLM_PLACEHOLDER_IMAGE_AT_DIGEST
      command: ["/bin/bash", "-lc"]
      args:
        - |
          set -euo pipefail
          test "${TORCH_SYMM_MEM_DISABLE_MULTICAST}" = 1
          python - <<'PY' | tee /evidence/image-preflight.txt
          from pathlib import Path
          import torch

          root = Path(torch.__file__).resolve().parent
          matches = [
              path for path in (root / "lib").glob("*.so")
              if b"TORCH_SYMM_MEM_DISABLE_MULTICAST" in path.read_bytes()
          ]
          assert matches, "installed PyTorch lacks the multicast control"
          print("torch_version", torch.__version__)
          print("torch_root", root)
          print("multicast_control_files", *matches, sep="\n")
          PY
          /usr/local/bin/dynamo-snapshot-cuda-vmm-pair \
            /usr/local/lib/dynamo/libdynamo_snapshot_cuda_vmm.so \
            > >(tee /evidence/pair.jsonl) \
            2> >(tee /evidence/shim.stderr >&2)
          ! grep -q 'event=multicast_rejected' /evidence/shim.stderr
          test "$(grep -c \
            'event=commit.*multicast_attempts=0 unsupported=0x0' \
            /evidence/shim.stderr)" -eq 2
      env:
        - name: CUDA_VISIBLE_DEVICES
          value: "0,1"
        - name: DYN_SNAPSHOT_CUDA_VMM_INTERPOSE
          value: "1"
        - name: DYN_SNAPSHOT_CUDA_VMM_FORCE_POSIX
          value: "1"
        - name: TORCH_SYMM_MEM_DISABLE_MULTICAST
          value: "1"
        - name: DYN_SNAPSHOT_CONTROL_DIR
          value: "/snapshot-control"
      resources:
        limits:
          nvidia.com/gpu: 2
      securityContext:
        privileged: true
        runAsUser: 0
      volumeMounts:
        - name: control
          mountPath: /snapshot-control
        - name: evidence
          mountPath: /evidence
  volumes:
    - name: control
      emptyDir: {}
    - name: evidence
      emptyDir: {}
